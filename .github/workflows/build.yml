name: Wails Build and Release

on:
  push:
    branches:
      - github-actions-test

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'App'
            platform:  'linux/amd64'
            os: 'ubuntu-latest'
          - name: 'App'
            platform:  'linux/arm64'
            os: 'ubuntu-latest'
          - name: 'App'
            platform:  'windows/amd64'
            os: 'windows-latest'
          - name: 'App'
            platform:  'darwin/universal'
            os: 'macos-latest'

    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
        with:
          submodules: recursive

      - name: Install Linux dependencies (libasound2-dev)
        if: ${{ matrix.build.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build Wails application
        uses: dAppServer/wails-build-action@main
        id: build
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          package: false
          go-version: '1.23'
          node-version: '22.14'

      - name: Prepare artifact name
        id: prepare_name
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
              $platform_name = "${{ matrix.build.platform }}"
              $artifact_name = "${{ matrix.build.name }}-" + $platform_name.Replace("/", "-")
              echo "artifact_name=$artifact_name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          else
              artifact_name=$(echo "${{ matrix.build.name }}-${{ matrix.build.platform }}" | tr '/' '-')
              echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_name.outputs.artifact_name }}
          path: build/bin/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*/*
          draft: false      
          prerelease: false 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
